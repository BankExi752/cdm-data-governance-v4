name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-asset-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data-asset-lab/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          MIAODA_CLIENT_BASE_PATH: /cdm-data-governance-v4/
      - name: Merge CDN assets into output for Pages
        run: cp -r dist/output_resource/assets dist/output/assets
      - name: SPA fallback for client-side routes
        run: cp dist/output/index.html dist/output/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data-asset-lab/dist/output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
